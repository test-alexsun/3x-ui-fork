name: CI
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xui_test
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: xui_source
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xui_test -d xui_source"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'ruff>=0.8,<1'
      - run: sudo apt-get update && sudo apt-get install -y nginx openssl postgresql-client shellcheck
      - run: bash -n bootstrap.sh install.sh
      - run: shellcheck bootstrap.sh install.sh
      - run: ruff check --select E4,E7,E9,F,I src tests
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: PYTHONPATH=src python tests/integration_postgres.py
        env:
          XUI_RUN_PG_INTEGRATION: '1'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: xui_test
          PGPASSWORD: testpass
          PGDATABASE: xui_source
      - run: PYTHONPATH=src python -m xui_fork.cli check
  debian13:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Debian 13 container preflight and tests (no systemd claim)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work:ro" -w /work debian:trixie-slim \
            sh -c 'apt-get update && apt-get install -y python3 && PYTHONPATH=src python3 -m unittest discover -s tests -v && PYTHONPATH=src python3 -m xui_fork.cli dry-run --action install'
  install-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Require real systemd on disposable runner
        run: test -d /run/systemd/system && systemctl --version
      - name: Fresh official panel install on loopback
        run: |
          sudo env PYTHONPATH="$GITHUB_WORKSPACE/src" python3 -m xui_fork.cli dry-run --action install --panel-port 32053
          sudo env PYTHONPATH="$GITHUB_WORKSPACE/src" python3 -m xui_fork.cli install --panel-port 32053
      - name: Check service, ownership state, and listener
        run: |
          sudo systemctl is-active --quiet x-ui
          sudo test -f /var/lib/3x-ui-fork/state.json
          sudo test -f /etc/x-ui/fork-credentials.json
          ss -lnt | grep -q '127.0.0.1:32053'
          if ss -lnt | grep -Eq '(0.0.0.0|\[::\]):32053'; then exit 1; fi
      - name: VLESS REALITY Vision API and Xray client traffic
        run: sudo env PYTHONPATH="$GITHUB_WORKSPACE/src" XUI_RUN_INBOUND_E2E=1 python3 tests/integration_inbound_reality.py
      - name: Web and gRPC TLS API, subscriptions, and Xray client traffic
        run: sudo env PYTHONPATH="$GITHUB_WORKSPACE/src" XUI_RUN_INBOUND_WEB_E2E=1 python3 tests/integration_inbound_web_tls.py
      - name: VLESS XHTTP REALITY API, subscription, and Xray client traffic
        run: sudo env PYTHONPATH="$GITHUB_WORKSPACE/src" XUI_RUN_INBOUND_REALITY_XHTTP_E2E=1 python3 tests/integration_inbound_reality_xhttp.py
      - name: VLESS ML-KEM768 XHTTP TLS API, subscription, and Xray client traffic
        run: sudo env PYTHONPATH="$GITHUB_WORKSPACE/src" XUI_RUN_INBOUND_MLKEM_E2E=1 python3 tests/integration_inbound_mlkem.py
      - name: Shadowsocks 2022 API, subscription, and TCP/UDP Xray traffic
        run: sudo env PYTHONPATH="$GITHUB_WORKSPACE/src" XUI_RUN_INBOUND_SS2022_E2E=1 python3 tests/integration_inbound_shadowsocks2022.py
      - name: Hysteria2 API, subscription, and TCP/UDP Xray traffic
        run: sudo env PYTHONPATH="$GITHUB_WORKSPACE/src" XUI_RUN_INBOUND_HYSTERIA2_E2E=1 python3 tests/integration_inbound_hysteria2.py
      - name: WireGuard API, peer, subscription, and TCP/UDP Xray traffic
        run: sudo env PYTHONPATH="$GITHUB_WORKSPACE/src" XUI_RUN_INBOUND_WIREGUARD_E2E=1 python3 tests/integration_inbound_wireguard.py
      - name: Download pinned sing-box TUIC client
        run: |
          curl --fail --location --silent --show-error --retry 3 --max-time 120 \
            https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-linux-amd64-glibc.tar.gz \
            -o /tmp/sing-box-tuic.tar.gz
          echo '231e57c18378f780a08de832844a1ca9716e17a7bcf82964b350844d243c03ac  /tmp/sing-box-tuic.tar.gz' | sha256sum -c -
          tar -xzf /tmp/sing-box-tuic.tar.gz -C /tmp sing-box-1.14.4-linux-amd64-glibc/sing-box
          test -x /tmp/sing-box-1.14.4-linux-amd64-glibc/sing-box
      - name: TUIC v5 native backend, link, TLS, and TCP/UDP sing-box traffic
        run: sudo env PYTHONPATH="$GITHUB_WORKSPACE/src" XUI_RUN_INBOUND_TUIC_E2E=1 python3 tests/integration_inbound_tuic.py
      - name: MASQUE HTTP3 CONNECT-IP API, TLS, and TCP/UDP Xray traffic
        run: sudo env PYTHONPATH="$GITHUB_WORKSPACE/src" XUI_RUN_INBOUND_MASQUE_E2E=1 python3 tests/integration_inbound_masque.py
      - name: Exercise owned repair, SQLite backup and restore, uninstall and rollback
        run: |
          sudo rm /usr/bin/x-ui
          sudo env PYTHONPATH="$GITHUB_WORKSPACE/src" python3 -m xui_fork.cli repair
          sudo test -x /usr/bin/x-ui
          sudo env PYTHONPATH="$GITHUB_WORKSPACE/src" python3 -m xui_fork.cli update > /tmp/xui-update-result.json
          python3 -c 'import json; assert json.load(open("/tmp/xui-update-result.json"))["changed"] is False'
          sudo env PYTHONPATH="$GITHUB_WORKSPACE/src" python3 -m xui_fork.cli backup --backend sqlite --source /etc/x-ui/x-ui.db --output /tmp/xui-ci-backup > /tmp/xui-backup-result.json
          BACKUP=$(python3 -c 'import json; print(json.load(open("/tmp/xui-backup-result.json"))["backup"])')
          sudo env PYTHONPATH="$GITHUB_WORKSPACE/src" python3 -m xui_fork.cli restore --backup "$BACKUP" --to-new-file /tmp/x-ui-ci-restored.db
          sudo env PYTHONPATH="$GITHUB_WORKSPACE/src" python3 -m xui_fork.cli uninstall --confirm-uninstall
          sudo test -f /etc/x-ui/x-ui.db
          sudo env PYTHONPATH="$GITHUB_WORKSPACE/src" python3 -m xui_fork.cli rollback
          sudo systemctl is-active --quiet x-ui
